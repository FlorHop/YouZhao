# =============================================================================
# 有招 · 网关（gateway 容器，image: nginx:1.27-alpine）—— 全站唯一入口
# -----------------------------------------------------------------------------
# 挂载方式（见 compose.yaml 的 gateway 服务）：
#   本文件 → /etc/nginx/templates/youzhao.conf.template
#   nginx 官方镜像入口脚本 /docker-entrypoint.d/20-envsubst-on-templates.sh 会做一次
#   envsubst，渲染到 /etc/nginx/conf.d/youzhao.conf 后才加载。因此：
#     ${...}  = 由容器环境注入（deploy/.env → compose environment）：改域名/上限只改 .env；
#     $var    = nginx 自身变量，envsubst 不会碰（容器里没有同名环境变量）。
#   注意：渲染是纯文本替换，注释里的 ${...} 也会被替换；写 nginx 变量请用 $var（不要 ${var}）。
#
# 分流表（容器内端口固定 80 / 8080，宿主机端口由 compose 映射）：
#   应用域 ${GATEWAY_APP_HOST}      :80     /          → web（SPA 静态；index.html 回退在 web 容器内完成）
#                                          /api/      → api
#                                          /mcp       → api（Streamable HTTP：全链路关闭缓冲）
#                                          /health    → api（探活别名，供 healthcheck/监控）
#                                          /preview*  → 404（预览只在预览域提供，见下）
#   预览域 ${GATEWAY_PREVIEW_HOST}  :8080   /preview   → api（产物沙箱；独立源，§4.6/§7）
#                                          /health    → api
#                                          *          → 404
#
# 安全前提：产物只在预览域（与应用不同源）执行；应用域看不到 /preview 内容。
# TLS 默认关闭（本地验收无证书），文末给出证书挂载位置与 80→443 跳转写法。
# =============================================================================

# 上游：compose 服务名 + 内置 DNS（容器 DNS 名由 compose 网络解析）
upstream youzhao_api {
  server api:3000;
  # 与 api 保持长连接（MCP 的 SSE 与高频 /api 调用都受益）
  keepalive 32;
}

upstream youzhao_web {
  server web:80;
  keepalive 8;
}

# 有 Upgrade 才升级连接，否则保持上游长连接复用（空值 = 不发送该头）
map $http_upgrade $youzhao_connection {
  default upgrade;
  ''      '';
}

# 注意（§4.7）：MCP-Protocol-Version 以及所有 Mcp-* 请求头一律原样透传。
# 全文件不要为它们写 proxy_set_header —— 那会覆盖客户端原值。nginx 默认转发所有
# 非逐跳请求头，因此「不写」就是「正确透传」；这里只补 Host / X-Forwarded-*。

server {
  listen 80 default_server;
  # 容器内没有 IPv6 时 listen [::]:80 会导致 nginx 起不来，故默认只监听 IPv4；
  # 需要 IPv6 时自行加：listen [::]:80 default_server;
  server_name ${GATEWAY_APP_HOST} _;

  # 与应用侧 Fastify bodyLimit / MCP_MAX_BODY_BYTES 对齐；比应用小会先于应用返回 413。
  client_max_body_size ${API_JSON_BODY_LIMIT_BYTES};
  client_body_buffer_size 1m;

  proxy_connect_timeout 10s;
  proxy_send_timeout 300s;

  # ── 探活 ──────────────────────────────────────────────────────────────────
  location = /health {
    proxy_pass http://youzhao_api/api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
  }

  # ── 应用 API ─────────────────────────────────────────────────────────────
  location /api/ {
    proxy_pass http://youzhao_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $youzhao_connection;
    # 发布/解包等长任务：给足读超时
    proxy_read_timeout 300s;
  }

  # ── MCP Streamable HTTP（§4.7 的网关硬性要求）─────────────────────────────
  #   * proxy_buffering off / proxy_request_buffering off：SSE 与流式响应必须实时到客户端，
  #     否则事件被攒批、甚至等响应结束才吐出；
  #   * proxy_http_version 1.1 + Connection ""：走 HTTP/1.1 长连接（不要升级成 WebSocket）；
  #   * 读超时给足：MCP 会话可以长时间没有事件；
  #   * 不要在这里启用 gzip（缓冲/压缩都会破坏 SSE 的实时性）；
  #   * Mcp-* / MCP-Protocol-Version 头不写 proxy_set_header，原样透传。
  location /mcp {
    proxy_pass http://youzhao_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;
  }

  # ── 预览路径不在应用域提供 ────────────────────────────────────────────────
  # 产物必须在**独立源**（预览域）执行；应用域命中 /preview* 一律 404，
  # 而不是回退给 SPA 或转发给 api，避免出现「产物与应用同源」的旁路。
  location = /preview {
    return 404;
  }
  location ^~ /preview/ {
    return 404;
  }

  # ── 应用前端（SPA）───────────────────────────────────────────────────────
  # 静态文件与 SPA 回退（try_files $uri $uri/ /index.html）由 web 容器内的
  # deploy/web/nginx.conf 完成；网关只做透传，避免同一条规则两处漂移。
  # web 侧已配 /assets/ 长缓存与 /index.html no-cache，这里不覆盖其缓存头。
  location / {
    proxy_pass http://youzhao_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $youzhao_connection;
    proxy_read_timeout 60s;
  }
}

# =============================================================================
# 预览域（独立源）：只放行 /preview（= api 的 PREVIEW_PUBLIC_BASE_PATH）
# =============================================================================
server {
  listen 8080 default_server;
  # 需要 IPv6 时自行加：listen [::]:8080 default_server;
  server_name ${GATEWAY_PREVIEW_HOST} _;

  client_max_body_size ${API_JSON_BODY_LIMIT_BYTES};

  location = /health {
    proxy_pass http://youzhao_api/api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
  }

  # 预览产物入口（门票校验、CSP、frame-ancestors 都在 api 侧，网关不改写任何头）
  location /preview {
    proxy_pass http://youzhao_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_cache off;
  }

  # 预览域不做应用域的任何事
  location / {
    return 404;
  }
}

# =============================================================================
# TLS（默认关闭；本地验收无证书）
# -----------------------------------------------------------------------------
# 1) 证书位置：放到 deploy/.env 的 GATEWAY_TLS_CERT_DIR（默认 ./certs）：
#      certs/fullchain.pem   certs/privkey.pem
#    并在 compose.yaml 的 gateway 服务里取消这一行的注释：
#      - ${GATEWAY_TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
# 2) 应用域改监听 443（把上面 server 块的 `listen 80 default_server;` 换掉）：
#      listen 443 ssl;
#      ssl_certificate     /etc/nginx/certs/fullchain.pem;
#      ssl_certificate_key /etc/nginx/certs/privkey.pem;
#      ssl_protocols       TLSv1.2 TLSv1.3;
#      ssl_prefer_server_ciphers off;
#      ssl_session_cache   shared:SSL:10m;
#      ssl_session_timeout 1d;
#      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#    预览域同理：把第二个 server 块改成 `listen 443 ssl;` + 同一对证书，
#    并把 compose 里的 GATEWAY_PREVIEW_HTTP_PORT 改成 443（宿主机侧）。
#    注意：启用 TLS 后 .env 的 APP_HOST / API_PUBLIC_BASE_URL / PREVIEW_DOMAIN 必须是
#    https://（config.ts 在 APP_ENV=production 下强制）。
# 3) 80 → 443 跳转：把上面两个 server 块的 80 监听删掉，改用下面两块（取消注释，
